name: App Repo Generation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Install Deps
      run: |
        sudo apt update -y
        sudo apt install -y zopfli fsverity signify-openbsd
        # symlink so your Python script can call "signify"
        sudo ln -sf /usr/bin/signify-openbsd /usr/local/bin/signify

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'build-tools;37.0.0'

    - name: Add buildtools to path
      run: echo "$ANDROID_SDK_ROOT/build-tools/37.0.0/" >> $GITHUB_PATH

    - name: Configure git
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    - name: clear old metadata
      run: rm -rf apps/

    - name: pull files from storage
      run: |
        git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/dot166/apks.git apks
        cp -r apks/* ./
        chown $(whoami) apps.0.sec
        chmod 600 apps.0.sec
        rm -rf apks/

    - name: Download GrapheneOS packages
      run: cargo run

    - name: Recombine and Decompress Base APK
      run: |
        find . -type f -name "base.apk.gz.chunk_aa" | while read -r chunk_path; do
          chunk_dir=$(dirname "$chunk_path")
          cd "$chunk_dir"
          echo "Processing chunks in $chunk_dir..."
          cat base.apk.gz.chunk_* > base.apk.gz
          gunzip base.apk.gz
          rm -f base.apk.gz.chunk_*
          cd - > /dev/null
        done

    - name: Commit metadata
      run: |
        git add .
        git commit -m "[AUTO] Update apps" || true

    - name: Push changes to repo
      uses: ad-m/github-push-action@master
      with:
        branch: ${{ github.ref }}

    - name: Generate repo metadata
      run: ./generate.py

    - name: copy repo files to static-tmp
      run: ./process-static

    - name: Upload site artifact for Pages
      uses: actions/upload-pages-artifact@v5
      with:
        path: static-tmp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

